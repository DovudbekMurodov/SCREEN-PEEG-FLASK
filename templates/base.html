<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ _("出張精算 チェックシート") }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='rakuraku.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">{{ _("出張精算 チェックシート") }}</a>
        <div class="navlinks">
          <a href="/oneclick" class="{% if request.path.startswith('/oneclick') %}active{% endif %}">{{ _("ワンクリック実行") }}</a>
          <a href="/" class="{% if request.path == '/' %}active{% endif %}">{{ _("チェックシート") }}</a>
          <a href="/seisan" class="{% if request.path.startswith('/seisan') %}active{% endif %}">{{ _("楽楽精算") }}</a>
          <a href="/kintai" class="{% if request.path.startswith('/kintai') %}active{% endif %}">{{ _("楽楽勤怠") }}</a>
        </div>
        <div class="langswitch">
          <select aria-label="{{ _('表示言語') }}" onchange="if (this.value) location.href = this.value;">
            {% for code, label in languages %}
              <option value="/lang/{{ code }}?next={{ current_url|urlencode }}" lang="{{ code }}"
                      {% if code == lang %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
          <noscript>{% for code, label in languages %}<a href="/lang/{{ code }}?next={{ current_url|urlencode }}" hreflang="{{ code }}">{{ label }}</a>{% endfor %}</noscript>
        </div>
      </div>
    </nav>
    {% block body %}{% endblock %}
  </body>
</html>
